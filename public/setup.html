<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Configurazione iniziale</title>
  <style>
    body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; background: #fafaf9; color: #292524; margin: 0; display: flex; min-height: 100vh; align-items: center; justify-content: center; padding: 16px; }
    .card { background: #fff; border: 1px solid #e7e5e4; border-radius: 16px; padding: 28px; width: 100%; max-width: 420px; box-shadow: 0 1px 3px rgba(28,25,23,.06); }
    h1 { font-size: 20px; margin: 0 0 6px; }
    p { font-size: 14px; color: #78716c; margin: 0 0 18px; line-height: 1.5; }
    label { display: block; font-size: 12px; font-weight: 600; color: #a8a29e; text-transform: uppercase; letter-spacing: .04em; margin: 12px 0 6px; }
    input { width: 100%; box-sizing: border-box; border: 1px solid #d6d3d1; border-radius: 10px; padding: 10px 12px; font-size: 14px; }
    button { margin-top: 18px; width: 100%; background: #8a6a2e; color: #fff; border: 0; border-radius: 10px; padding: 11px; font-size: 14px; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: .5; }
    .msg { margin-top: 14px; font-size: 13px; border-radius: 10px; padding: 10px 12px; display: none; }
    .ok { background: #dcfce7; color: #166534; display: block; }
    .err { background: #fee2e2; color: #991b1b; display: block; }
    code { background: #f5f5f4; padding: 1px 5px; border-radius: 5px; }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="titolo">Configurazione iniziale</h1>
    <p id="intro">Attendere…</p>
    <form id="f">
      <label>Token di configurazione (SETUP_TOKEN)</label>
      <input id="token" type="password" autocomplete="off" required />
      <div id="campoNome" style="display:none"><label>Nome del salone</label><input id="nome" /></div>
      <label>Email di accesso</label>
      <input id="email" type="email" required />
      <label>Password (min 6 caratteri)</label>
      <input id="password" type="password" minlength="6" required />
      <button id="btn" type="submit">Crea</button>
    </form>
    <div id="msg" class="msg"></div>
  </div>
  <script>
    (async () => {
      let modalita = "hub";
      try { const r = await fetch("/api/installazione"); const j = await r.json(); modalita = j.modalita === "cliente" ? "cliente" : "hub"; if (j.modalita === "cliente" && j.stato !== "setup") { document.getElementById("intro").textContent = "Il salone di questa installazione è già configurato. Vai su /gestionale per accedere."; document.getElementById("f").style.display = "none"; return; } } catch (e) {}
      const cliente = modalita === "cliente";
      document.getElementById("titolo").textContent = cliente ? "Crea il salone" : "Crea l'amministratore";
      document.getElementById("intro").innerHTML = cliente
        ? "Primo avvio dell'installazione: crea il salone e l'accesso del titolare. Il titolare entrerà da <code>/gestionale</code> con questa email e password."
        : "Primo avvio del portale Lucentia: crea l'account di amministrazione. Funziona una volta sola.";
      document.getElementById("btn").textContent = cliente ? "Crea salone" : "Crea amministratore";
      if (cliente) { document.getElementById("campoNome").style.display = "block"; document.getElementById("nome").required = true; }
      document.getElementById("f").addEventListener("submit", async (ev) => {
        ev.preventDefault();
        const btn = document.getElementById("btn"); btn.disabled = true;
        const msg = document.getElementById("msg"); msg.className = "msg";
        const body = { token: document.getElementById("token").value, email: document.getElementById("email").value.trim(), password: document.getElementById("password").value, denominazione: document.getElementById("nome").value.trim() };
        try {
          const r = await fetch("/api/setup", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
          const j = await r.json().catch(() => ({}));
          if (r.ok) { msg.className = "msg ok"; msg.innerHTML = cliente ? "Salone creato. Ora accedi da <a href='/gestionale'>/gestionale</a>." : "Amministratore creato. Ora accedi dalla <a href='/#login'>home</a>."; }
          else { msg.className = "msg err"; msg.textContent = j.error || "Errore."; btn.disabled = false; }
        } catch (e) { msg.className = "msg err"; msg.textContent = "Errore di rete."; btn.disabled = false; }
      });
    })();
  </script>
</body>
</html>
