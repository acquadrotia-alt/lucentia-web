# Costruisce il programma Windows della cassa (cartella desktop/): installazione e versione
# portatile, da scaricare dalla pagina dell'esecuzione (Artifacts). Si lancia a mano da Actions.
name: Programma Windows (Lucentia Cassa)
on:
  workflow_dispatch:
jobs:
  costruisci:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: lucentia-cassa-windows
          path: desktop/dist/*.exe
          if-no-files-found: error
